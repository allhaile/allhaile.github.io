title: Haile API
description: "Web engineer. Cognitive science graduate. Building interfaces that make technical things feel intuitive."
url: "https://haileshavers.com"
baseurl: ""
author:
  name: Haile Shavers
  email: ""
  github: allhaile
  linkedin: hshavers
  substack: allhaile
  youtube: hungryhighly
  instagram: allhaile
  instagram_food: hungryhighly

permalink: /blog/:year/:month/:day/:title/
timezone: America/Los_Angeles

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

exclude:
  - .archive
  - node_modules
  - package.json
  - package-lock.json
  - yarn.lock
  - README.md
  - Gemfile
  - Gemfile.lock

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
