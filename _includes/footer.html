<footer class="footer">
  <div class="footer-inner">
    <p class="footer-copy">&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }} &mdash; {{ site.title }} v2.0</p>
    <div class="footer-links">
      <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://substack.com/@{{ site.author.substack }}" target="_blank" rel="noopener">Substack</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
    <div class="footer-status">
      <span class="status-indicator"></span>
      <span class="status-text">200 OK</span>
    </div>
  </div>
</footer>
