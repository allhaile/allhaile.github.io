<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d5a39">
<meta name="description" content="A phone-friendly game for learning the 42 AKC Rally Novice signs, scoring, and a heel training plan for small dogs.">
<title>Little Lion Rally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a rally ring on a phone. White course signs on stands sit on ring-mat green; the judge's scoresheet tallies in tabular numbers. */
:root{
  --bg:#e7eee6;
  --surface:#fbfdfa;
  --ink:#14211a;
  --muted:#58695d;
  --mat:#1d5a39;
  --accent:#2445c4;
  --line:#c8d5ca;
  --good:#1d7a43;
  --bad:#bf3328;
  --warn:#a86a12;
  --on-accent:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.02}
h1{font-size:2rem}
h2{font-size:1.6rem}
h3{font-size:1.2rem}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px;display:grid;gap:18px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.brand small{display:block;font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.14em;color:var(--mat);text-transform:uppercase}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;color:var(--muted);background:var(--surface)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;border-radius:10px;padding:13px 16px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1rem;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--mat);border-color:var(--mat);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.tile b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tile span{font-size:.75rem;color:var(--muted);line-height:1.2;display:block;margin-top:4px}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}

/* The sign on its stand */
.stand{display:grid;justify-items:center;gap:0}
.sign{background:#fff;color:#111;border:3px solid #111;border-radius:6px;width:min(220px,62vw);aspect-ratio:8.5/11;display:grid;grid-template-rows:auto 1fr auto;padding:10px 10px 12px;position:relative;box-shadow:0 10px 0 -4px rgba(0,0,0,.12)}
.sign .num{font-family:var(--display);font-weight:800;font-size:1.05rem;border:2.5px solid #111;border-radius:50%;width:2.1rem;height:2.1rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.sign .cls{position:absolute;top:12px;right:12px;font-family:var(--display);font-weight:800;font-size:.85rem;letter-spacing:.1em}
.sign svg{width:100%;height:100%;max-height:150px;align-self:center}
.sign .nm{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.25rem;line-height:1;text-align:center;text-wrap:balance}
.sign.sm{width:118px;padding:6px 6px 8px;border-width:2.5px}
.sign.sm .num{font-size:.8rem;width:1.6rem;height:1.6rem;border-width:2px}
.sign.sm .cls{display:none}
.sign.sm .nm{font-size:.85rem}
.sign.sm svg{max-height:70px}
.post{width:10px;height:26px;background:var(--mat);border-radius:0 0 3px 3px}
.base{width:90px;height:8px;border-radius:6px;background:var(--mat)}
.stand.sm .post{height:12px;width:7px}.stand.sm .base{width:56px;height:6px}
.hide-name .nm{visibility:hidden}

.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:1rem;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt:disabled{cursor:default}
.fb{border-left:5px solid var(--good);padding:10px 12px;background:color-mix(in srgb,var(--good) 8%,var(--surface));border-radius:0 10px 10px 0;display:grid;gap:6px}
.fb.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.fb.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.tip{font-size:.92rem;color:var(--muted)}
.tip b{color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mat);transition:width .3s}

/* scoresheet */
.sheet{font-variant-numeric:tabular-nums;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--surface)}
.sheet .hd{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1.5px solid var(--ink);font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.sheet table{width:100%;border-collapse:collapse;font-size:.92rem}
.sheet td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.sheet td:last-child{text-align:right;white-space:nowrap;font-weight:700}
.sheet tr.ded td:last-child{color:var(--bad)}
.scoreline{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.big{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:.9;font-variant-numeric:tabular-nums}
.judge{font-family:var(--display);font-weight:600;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mat)}

/* ribbon */
.ribbon{position:relative;width:132px;height:178px;margin:4px auto 0}
.ribbon .ros{position:absolute;inset:0 0 auto 0;width:132px;height:132px;border-radius:50%;background:repeating-conic-gradient(#1b7a40 0 6deg,#14632f 6deg 12deg);display:grid;place-items:center;z-index:2}
.ribbon .ctr{width:78px;height:78px;border-radius:50%;background:#f5f1df;border:3px solid #c9a227;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;color:#14632f;font-size:.82rem;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.ribbon .t1,.ribbon .t2{position:absolute;top:100px;width:30px;height:78px;background:#1b7a40;z-index:1;clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%)}
.ribbon .t1{left:36px;transform:rotate(9deg)}.ribbon .t2{right:36px;transform:rotate(-9deg)}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:.3}to{transform:none;opacity:1}}
}

/* Bottom ring-gate nav */
nav.gate{position:fixed;left:0;right:0;bottom:0;background:var(--mat);display:flex;justify-content:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.gate .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:720px;width:100%}
nav.gate a{color:#e8f3ea;text-decoration:none;text-align:center;font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;padding:8px 2px;border-radius:8px}
nav.gate a[aria-current="page"]{background:#fff;color:#14211a}
.list{display:grid;gap:10px}
.lvl{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:8px}
.lvl.done{border-color:var(--good)}
.lvl.locked{opacity:.55}
.lvl .hdr{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.badge{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--line);color:var(--ink);white-space:nowrap}
.badge.good{background:var(--good);color:var(--on-accent)}
.signgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sbtn{background:none;border:none;padding:0;display:grid;justify-items:center;gap:6px}
.sbtn .m{font-size:.75rem;color:var(--muted)}
.sbtn .m.ok{color:var(--good);font-weight:700}
.detail{display:grid;gap:12px;justify-items:center;text-align:left}
.detail .txt{display:grid;gap:8px;width:100%}
ul.check{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.check li{display:flex;gap:10px;align-items:flex-start}
ul.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--mat);flex:none}
label.field{display:grid;gap:6px;font-size:.9rem;color:var(--muted)}
label.field input{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:1rem}
.rules{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.95rem}
.rules dt{font-family:var(--display);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--mat);text-align:right;line-height:1.25}
.rules dd{margin:0}
footer{font-size:.82rem;color:var(--muted);display:grid;gap:6px}
footer a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="gate" aria-label="Sections"><div class="in" id="nav"></div></nav>
<script>
(function(){
"use strict";
/* ---------- Data: AKC Rally Novice signs 1-42 ---------- */
const UNITS={1:"Basics & Pace",2:"Turns",3:"Circles & Loops",4:"Fronts & Finishes",5:"Halts & Stays",6:"Cones & Side Step"};
const SIGNS=[
{n:1,u:1,name:"Start",ic:"start",d:"Marks the beginning of the course. Your dog does not have to be sitting.",tip:"Set up in heel position anyway. A calm start sets the tone."},
{n:2,u:1,name:"Finish",ic:"finish",d:"Marks the end of the course. The clock stops when you pass it.",tip:"Keep the leash loose all the way past the sign, then celebrate."},
{n:3,u:1,st:1,name:"Halt – Sit",ic:"oct",t:["SIT"],d:"Stop. Your dog sits in heel position. Then heel forward.",tip:"Stop square and look ahead. Twisting to look down at a small dog pulls the sit crooked."},
{n:4,u:1,st:1,name:"Halt – Sit – Down",ic:"oct",t:["SIT","DOWN"],d:"Stop and your dog sits in heel position, then lies down in heel position. Then heel forward.",tip:"Teach a hand signal that sweeps toward the floor so you don't have to fold over a 15 lb dog."},
{n:17,u:1,name:"Slow Pace",ic:"slow",d:"Slow down noticeably. A Normal Pace sign follows, unless it's the last sign.",tip:"Make it obvious. The judge wants to see a clear change."},
{n:18,u:1,name:"Fast Pace",ic:"fast",d:"Speed up noticeably. A Normal Pace sign follows.",tip:"Small legs, big effort. Jog and cheer your dog on."},
{n:19,u:1,name:"Normal Pace",ic:"normal",d:"Return to a brisk normal walk. Only used right after a slow or fast pace.",tip:"Brisk is the word. A dragging normal pace costs points."},
{n:5,u:2,name:"Right Turn",ic:"right",d:"Make a 90° turn to the right while heeling.",tip:"Your dog is on the outside and travels farther. Talk them through it."},
{n:6,u:2,name:"Left Turn",ic:"right",m:1,d:"Make a 90° turn to the left while heeling.",tip:"Your dog is on the inside. Shorten your steps so you don't clip paws."},
{n:7,u:2,name:"About Turn – Right",ic:"about",d:"Make a 180° turn to the right while heeling.",tip:"Keep your left hand at your seam so your dog can follow it around."},
{n:8,u:2,name:"About “U” Turn",ic:"about",m:1,d:"Make a 180° turn to the left while heeling, with your dog on the inside of the turn.",tip:"Slow way down into this one. Small dogs get stepped on here more than anywhere."},
{n:29,u:2,name:"Left About Turn",ic:"leftabout",d:"You turn 180° to the left while your dog moves around you to the right and ends in heel position.",tip:"Teach the dog's part first as a standing trick, then add your turn."},
{n:39,u:2,name:"Diagonal Right",ic:"diag",d:"Make an open-angle (about 45°) turn to the right while heeling.",tip:"The sign sits in your path. Turn at the sign, not after it."},
{n:40,u:2,name:"Diagonal Left",ic:"diag",m:1,d:"Make an open-angle (about 45°) turn to the left while heeling.",tip:"Same as the right diagonal, with smaller steps since your dog is on the inside."},
{n:9,u:3,name:"270° Right Turn",ic:"t270",d:"Make a tight 270° turn to the right while heeling.",tip:"Shortcut: a 270° right leaves you facing the same way a 90° left would."},
{n:10,u:3,name:"270° Left Turn",ic:"t270",m:1,d:"Make a tight 270° turn to the left while heeling.",tip:"Shuffle small steps and keep your dog tight to your leg."},
{n:11,u:3,name:"360° Right Turn",ic:"t360",d:"Make a tight full circle to the right while heeling, then keep going the same direction.",tip:"Pick a spot on the wall to finish facing so you come out straight."},
{n:12,u:3,name:"360° Left Turn",ic:"t360",m:1,d:"Make a tight full circle to the left while heeling, then keep going the same direction.",tip:"Your dog is on the inside: go slow so they can stay close without getting bumped."},
{n:37,u:3,name:"Loop Right",ic:"loop",d:"Loop to the right while heeling, crossing over your original path.",tip:"Think of drawing a lowercase cursive “e” on the floor."},
{n:38,u:3,name:"Loop Left",ic:"loop",m:1,d:"Loop to the left while heeling, crossing over your original path.",tip:"Same shape as Loop Right, mirrored. Small steps on the inside."},
{n:13,u:4,st:1,name:"Call Front – Finish Right – Forward",ic:"front",f:"R",d:"Stop and call your dog to sit in front of you. Without moving your feet, your dog finishes to the right, around behind you to heel. Then heel forward.",tip:"Stand tall with hands centered at your waist. Leaning over a small dog makes them sit too far away."},
{n:14,u:4,st:1,name:"Call Front – Finish Left – Forward",ic:"front",f:"L",d:"Stop and call your dog to sit in front of you. Without moving your feet, your dog swings to your left into heel. Then heel forward.",tip:"Lure the swing with your left hand at first, then fade it to a small signal."},
{n:15,u:4,st:1,name:"Call Front – Finish Right – Halt",ic:"front",f:"R",h:1,d:"Stop and call your dog to sit in front. Your dog finishes to the right into heel and sits. Then heel forward.",tip:"Same as #13 plus a sit at the end. Wait for the sit before you step off."},
{n:16,u:4,st:1,name:"Call Front – Finish Left – Halt",ic:"front",f:"L",h:1,d:"Stop and call your dog to sit in front. Your dog swings left into heel and sits. Then heel forward.",tip:"Same as #14 plus a sit at the end."},
{n:26,u:4,st:1,name:"Call Front – 1, 2, 3 Steps Backward",ic:"back123",d:"Call your dog to sit in front. Step back one step, then two, then three. Your dog follows and sits in front after each. Then finish and heel forward.",tip:"Small dogs love this one. Keep your steps short so they can keep up."},
{n:35,u:4,st:1,name:"Call Front – Return to Heel",ic:"walk",t:"FRONT",d:"Call your dog to sit in front. Your dog stays while you walk around behind it back to heel position. Pause, then heel forward.",tip:"Practice the stay with a hand on your belly button so your dog isn't tempted to follow your hands."},
{n:25,u:5,st:1,name:"Halt – 1, 2 & 3 Steps Forward",ic:"oct",t:["1·2·3"],d:"Halt and sit. Take one step and halt, two steps and halt, three steps and halt. Your dog heels with you and sits each time.",tip:"Count out loud in practice. It helps you keep the steps honest."},
{n:27,u:5,st:1,name:"Stop and Down",ic:"oct",t:["DOWN"],d:"Stop and your dog lies down in heel position, with no sit first. It stays down until you move forward.",tip:"Don't mix this up with #4. Here the dog goes straight to the down."},
{n:28,u:5,st:1,name:"Halt – Fast Forward from Sit",ic:"oct",t:["SIT","FAST"],d:"Halt and sit, then heel forward at a fast pace. A Normal Pace sign follows.",tip:"Burst off the line like it's a race. Then settle at the Normal sign."},
{n:36,u:5,st:1,name:"Halt – Slow Forward from Sit",ic:"oct",t:["SIT","SLOW"],d:"Halt and sit, then heel forward at a slow pace. A Normal Pace sign follows, unless it's the last sign.",tip:"Slow from the very first step. No warm-up stride at normal speed."},
{n:30,u:5,st:1,name:"Halt – Walk Around Dog",ic:"walk",t:"SIT",d:"Halt and sit. Your dog stays sitting while you walk all the way around it and back to heel. Pause, then heel forward.",tip:"Walk a wide circle at first so your dog doesn't swing around to follow you."},
{n:31,u:5,st:1,name:"Halt – Down – Walk Around Dog",ic:"walk",t:"DOWN",d:"Halt and sit, then down. Your dog stays down while you walk around it back to heel. Pause, then heel forward.",tip:"A down-stay is easier than a sit-stay for most small dogs. Build it on a mat at home."},
{n:33,u:5,st:1,name:"Halt – Right Turn – Forward",ic:"oct",t:["SIT","RIGHT"],d:"Halt and sit, then turn right together and heel forward.",tip:"Turn your feet and shoulders together so your dog reads the new direction."},
{n:34,u:5,st:1,name:"Halt – Left Turn – Forward",ic:"oct",t:["SIT","LEFT"],d:"Halt and sit, then turn left together and heel forward.",tip:"Pivot slowly into your dog so you don't knock them."},
{n:20,u:6,name:"Moving Side Step Right",ic:"side",d:"Take one step to the right, leading with your right foot, then keep heeling forward on the new line. Your dog moves with you.",tip:"Exaggerate the step at first. Your dog learns to read your hip."},
{n:21,u:6,name:"Spiral Right – Dog Outside",ic:"spiral",d:"Three cones in a row. Turn right around each cone, so your dog is on the outside of the spiral.",tip:"Your dog is on the outside, so they have more ground to cover. Keep the energy up."},
{n:22,u:6,name:"Spiral Left – Dog Inside",ic:"spiral",m:1,d:"Three cones in a row. Turn left around each cone, so your dog is on the inside of the spiral.",tip:"Your dog is on the inside. Slow down so the cones don't get knocked."},
{n:23,u:6,name:"Straight Figure 8 Weave Twice",ic:"weave",d:"Four cones in a line. Enter with the first cone on your left and weave through the line twice.",tip:"Speed up when your dog is on the outside of a cone, slow down when they're on the inside."},
{n:24,u:6,name:"Serpentine Weave Once",ic:"serp",d:"Four cones in a line. Enter with the first cone on your left and weave through once, without looping back.",tip:"Look where you're going next, not at the cone you're passing."},
{n:32,u:6,name:"Figure 8 – No Distractions",ic:"fig8",d:"Two cones 6–8 feet apart. Heel a full figure 8 around them. You may enter from either side.",tip:"Your pace changes naturally on each loop. Keep the leash loose through both."},
{n:41,u:6,name:"Offset Serpentine Right",ic:"offset",d:"Three cones with the middle cone set 3–4 feet to the right. Enter with the first cone on your right and snake through.",tip:"Walk the offset line during walkthrough so the angle doesn't surprise you."},
{n:42,u:6,name:"Offset Serpentine Left",ic:"offset",m:1,d:"Three cones with the middle cone set 3–4 feet to the left. Enter with the first cone on your left and snake through.",tip:"Mirror of #41. Watch which side the first cone goes on."}
];
const BYN={};SIGNS.forEach(s=>BYN[s.n]=s);

/* ---------- Sign icons (simplified, not the official art) ---------- */
let uid=0;
const P=(d,arrow=true,extra="")=>`<path d="${d}" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" ${arrow?'marker-end="MK"':""} ${extra}/>`;
const cone=(x,y)=>`<path d="M${x-7} ${y+8} L${x} ${y-9} L${x+7} ${y+8} Z" fill="#ef6a1c" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>`;
const txt=(x,y,s,size=15)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="${size}" fill="#111">${s}</text>`;
function oct(lines){
  const pts=[];for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4;pts.push((50+38*Math.cos(a)).toFixed(1)+","+(50+38*Math.sin(a)).toFixed(1));}
  const sz=lines.length===1?24:15;const y0=50-(lines.length-1)*sz*0.55+sz*0.36;
  return `<polygon points="${pts.join(" ")}" fill="none" stroke="#111" stroke-width="6" stroke-linejoin="round"/>`+txt(50,30,"HALT",11)+lines.map((l,i)=>txt(50,y0+i*sz*1.05+4,l,sz)).join("");
}
function iconInner(s){
  switch(s.ic){
    case "start":return P("M50 84 V20")+`<path d="M28 88 H72" stroke="#111" stroke-width="7" stroke-linecap="round"/>`;
    case "finish":{let r="";for(let i=0;i<4;i++)for(let j=0;j<3;j++)if((i+j)%2===0)r+=`<rect x="${34+i*12}" y="${18+j*12}" width="12" height="12" fill="#111"/>`;return `<rect x="34" y="18" width="48" height="36" fill="none" stroke="#111" stroke-width="3"/>`+r+`<path d="M34 16 V90" stroke="#111" stroke-width="6" stroke-linecap="round"/>`;}
    case "oct":return oct(s.t);
    case "right":return P("M38 88 V50 Q38 34 54 34 H72");
    case "about":return P("M32 88 V44 A18 18 0 0 1 68 44 V72");
    case "leftabout":return P("M68 88 V44 A18 18 0 0 0 32 44 V72")+`<circle cx="82" cy="78" r="7" fill="#fff" stroke="#111" stroke-width="4"/>`+`<path d="M82 66 V30" stroke="#111" stroke-width="3.5" stroke-dasharray="4 5" fill="none"/>`;
    case "diag":return P("M36 90 V64 L66 32");
    case "t270":return P("M42 90 V45 A18 18 0 1 1 60 63 L24 63");
    case "t360":return P("M38 92 V52 A16 16 0 0 1 70 52 A16 16 0 0 1 38 52 V18");
    case "loop":return P("M48 92 V60 C48 30 82 30 78 52 C74 70 38 64 38 40 V14");

    case "normal":return P("M16 50 H80")+txt(50,82,"NORMAL",17);
    case "front":{
      const dog=`<circle cx="50" cy="28" r="8" fill="#fff" stroke="#111" stroke-width="4.5"/>`;
      const h=`<circle cx="50" cy="60" r="11" fill="#111"/>`;
      const path=s.f==="R"?P("M60 30 C84 36 84 88 50 86 C34 86 30 78 32 66"):P("M40 32 C22 38 20 56 32 62");
      return dog+h+path+(s.h?txt(18,94,"SIT",14):"");}
    case "back123":return `<circle cx="50" cy="22" r="10" fill="#111"/><circle cx="50" cy="50" r="7" fill="#fff" stroke="#111" stroke-width="4.5"/>`+txt(26,92,"1",18)+txt(50,92,"2",18)+txt(74,92,"3",18)+P("M50 66 V78",false)+`<path d="M26 72 V78 M74 72 V78" stroke="#111" stroke-width="5" stroke-linecap="round"/>`;

    case "side":return P("M36 90 V62 L60 54 V16");

    case "weave":return cone(50,20)+cone(50,40)+cone(50,60)+cone(50,80)+P("M50 98 C30 92 30 70 50 70 C70 70 70 50 50 50 C30 50 30 30 50 30 C70 30 70 14 52 8",true,'stroke-width="5"');

/* ---------- Drill ---------- */
let drillUnit=0;
function startDrill(u){
  drillUnit=u;
  const pool=SIGNS.filter(s=>!u||s.u===u);
  // weight unmastered signs first
  const order=shuffle(pool).sort((a,b)=>(S.mast[a.n]||0)-(S.mast[b.n]||0));
  const qs=[];for(let i=0;i<10;i++)qs.push(order[i%order.length]);
  drill={qs:shuffle(qs).map(s=>makeQ(s)),i:0,right:0,answered:false,pick:null};jq=null;
}
function makeQ(s){
  const type=Math.random()<.6?"a":"b";
  const same=SIGNS.filter(x=>x.n!==s.n&&x.u===s.u&&x.n>2);
  const other=SIGNS.filter(x=>x.n!==s.n&&x.u!==s.u&&x.n>2);
  const dist=pick(same,2).concat(pick(other,2)).slice(0,2);
  if(dist.length<2)dist.push(...pick(other,2-dist.length));
  return {s,type,opts:shuffle([s,...dist])};
}
function renderDrill(){
  if(jq)return renderJudge();
  if(!drill||drill.done){
    const fin=drill&&drill.done;
    app.innerHTML=header("Practice","Drills")+(fin?`<section class="card"><div class="scoreline"><h2>Drill done</h2><span class="big">${drill.right}/10</span></div><p>${drill.right>=9?"Ring ready on these.":drill.right>=7?"Solid. Run it again to lock in the misses.":"Keep going. Misses come back first next round."}</p></section>`:"")+`
    <section class="card"><h2>Sign drill</h2><p class="muted">10 questions. See a sign, pick what to do, or read the move and pick the sign. Signs you miss come up first next time.</p>
    <div class="row" role="group" aria-label="Pick a unit">${[0,1,2,3,4,5,6].map(u=>`<button class="chip" data-u="${u}" aria-pressed="${u===drillUnit}">${u?UNITS[u]:"All signs"}</button>`).join("")}</div>
    <button class="btn block" id="go">Start sign drill</button></section>
    <section class="card"><h2>Judge's eye</h2><p class="muted">10 questions on scoring. Know what each mistake costs before it happens in the ring.</p><button class="btn ghost block" id="jgo">Start judge quiz</button></section>`;
    app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{drillUnit=+b.dataset.u;renderDrill();});
    document.getElementById("go").onclick=()=>{startDrill(drillUnit);renderDrill();window.scrollTo(0,0);};
    document.getElementById("jgo").onclick=()=>{jq={qs:pick(JQ,10),i:0,right:0,answered:false};renderJudge();window.scrollTo(0,0);};
    return;
  }
  const q=drill.qs[drill.i];const s=q.s;
  const prompt=q.type==="a"?`<div class="detail">${signHTML(s)}</div><h3>What do you and ${esc(dog())} do?</h3>`:`<div class="card" style="background:var(--bg)"><p style="font-size:1.08rem">“${esc(s.d)}”</p></div><h3>Which sign is this?</h3>`;
  const optText=o=>q.type==="a"?esc(o.d):`<b>#${o.n}</b> ${esc(o.name)}`;
  app.innerHTML=header("Sign drill · "+(drillUnit?UNITS[drillUnit]:"All signs"),`Question ${drill.i+1}<small class="muted" style="font-size:1rem"> /10</small>`)+`
  <div class="bar" aria-hidden="true"><i style="width:${drill.i*10}%"></i></div>
  <section class="card">${prompt}<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${optText(o)}</button>`).join("")}</div><div id="fb"></div></section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(drill.answered)return;drill.answered=true;
    const o=q.opts[+b.dataset.k];const ok=o.n===s.n;
    if(ok){drill.right++;S.mast[s.n]=(S.mast[s.n]||0)+1;}else S.mast[s.n]=0;
    markDay();save();
    app.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(q.opts[k].n===s.n)x.classList.add("right");else if(x===b)x.classList.add("wrong");});
    document.getElementById("fb").innerHTML=`<div class="fb${ok?"":" bad"}"><b>${ok?"Right.":"Not quite."} #${s.n} ${esc(s.name)}</b><span>${esc(s.d)}</span><span class="tip"><b>Small-dog tip:</b> ${esc(s.tip)}</span></div><button class="btn block" id="next" style="margin-top:12px">${drill.i<9?"Next":"See results"}</button>`;
    document.getElementById("next").onclick=()=>{drill.i++;drill.answered=false;if(drill.i>=10)drill.done=true;renderDrill();window.scrollTo(0,0);};
    document.getElementById("next").focus({preventScroll:true});
  });
}
function renderJudge(){
  if(jq.i>=10){
    app.innerHTML=header("Judge's eye","Results")+`<section class="card"><div class="scoreline"><h2>Scoring quiz</h2><span class="big">${jq.right}/10</span></div><p>${jq.right>=9?"You score like a judge.":"Run it again. Knowing the costs keeps you calm in the ring."}</p><div class="grid2"><button class="btn" id="again">Again</button><button class="btn ghost" id="done">Back to drills</button></div></section>`;
    document.getElementById("again").onclick=()=>{jq={qs:pick(JQ,10),i:0,right:0,answered:false};renderJudge();};
    document.getElementById("done").onclick=()=>{jq=null;drill=null;renderDrill();};
    return;
  }
  const [q,opts,ans,why]=jq.qs[jq.i];
  app.innerHTML=header("Judge's eye",`Question ${jq.i+1}<small class="muted" style="font-size:1rem"> /10</small>`)+`<div class="bar" aria-hidden="true"><i style="width:${jq.i*10}%"></i></div>
  <section class="card"><p class="judge">Judge's clipboard</p><h3 style="text-transform:none;font-size:1.35rem">${esc(q)}</h3><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="fb"></div></section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(jq.answered)return;jq.answered=true;const k=+b.dataset.k;const ok=k===ans;if(ok)jq.right++;
    app.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(i===ans)x.classList.add("right");else if(x===b)x.classList.add("wrong");});
    document.getElementById("fb").innerHTML=`<div class="fb${ok?"":" bad"}"><b>${ok?"Right.":"Not quite."}</b><span>${esc(why)}</span></div><button class="btn block" id="next" style="margin-top:12px">${jq.i<9?"Next":"See results"}</button>`;
    document.getElementById("next").onclick=()=>{jq.i++;jq.answered=false;renderJudge();window.scrollTo(0,0);};
  });
}

/* ---------- Mock course ---------- */
function buildCourse(){
  const N=rint(10,15), nStat=rint(3,5);
  const needsNormal=n=>n===17||n===18||n===28||n===36;
  const stat=pick(SIGNS.filter(s=>s.st).map(s=>s.n),nStat);
  const mov=shuffle(SIGNS.filter(s=>!s.st&&![1,2,19].includes(s.n)).map(s=>s.n));
  const items=[];let total=0;
  stat.forEach(n=>{const u=needsNormal(n)?[n,19]:[n];items.push(u);total+=u.length;});
  for(const n of mov){if(total>=N)break;const u=needsNormal(n)?[n,19]:[n];if(total+u.length>N)continue;items.push(u);total+=u.length;}
  return shuffle(items).flat();
}
function startCourse(){
  const seq=buildCourse();
  const slots=shuffle([...Array(seq.length).keys()].slice(1)).slice(0,3).sort((a,b)=>a-b);
  const moms=pick(MOMENTS.map((_,i)=>i),3);
  const momentAt={};slots.forEach((s,i)=>{if(Math.random()<.8)momentAt[s]=moms[i];});
  course={seq,i:-1,phase:"intro",tries:0,ded:seq.map(()=>[]),momentAt,nq:null,opts:null};
}
const stationTotal=i=>Math.min(10,course.ded[i].reduce((a,d)=>a+d.p,0));
const scoreNow=()=>100-course.seq.reduce((a,_,i)=>a+stationTotal(i),0);
function renderCourse(){
  if(!course||course.phase==="menu"){
    app.innerHTML=header("Mock trial","Walk a course")+`<section class="card"><p>You'll get a random Novice course: 10–15 signs, 3–5 of them stationary, built the way AKC courses are. At each sign, pick what you and ${esc(dog())} do. Things happen between signs too, like a sniff or a crooked sit. You start with 100 points.</p>
    <dl class="rules"><dt>−3</dt><dd>first wrong answer on a sign (you use your retry)</dd><dt>−10</dt><dd>wrong again: Incorrectly Performed</dd><dt>NQ</dt><dd>food in the ring, skipping a sign, and other run-enders</dd></dl>
    <button class="btn block" id="go">Enter the ring</button></section>
    <section class="card"><h2>Before the ring</h2><ul class="check">${CHECK.map((c,i)=>`<li><input type="checkbox" id="ck${i}" ${S.check[i]?"checked":""}><label for="ck${i}">${esc(c)}</label></li>`).join("")}</ul></section>
    <p class="muted">${S.runs} runs so far · best score ${S.runs?S.best:"–"} · ${S.legs} of 3 legs</p>`;
    document.getElementById("go").onclick=()=>{startCourse();renderCourse();window.scrollTo(0,0);};
    CHECK.forEach((_,i)=>{const c=document.getElementById("ck"+i);c.onchange=()=>{S.check[i]=c.checked;save();};});
    return;
  }
  const c=course;const n=c.seq.length;
  const top=(label)=>header(`Mock trial · ${n} signs`,label)+`<div class="row" style="justify-content:space-between"><span class="pill">Sign ${Math.max(0,c.i+1)} of ${n}</span><span class="pill" style="font-variant-numeric:tabular-nums">Score <b style="color:var(--ink)">${scoreNow()}</b></span></div><div class="bar" aria-hidden="true"><i style="width:${Math.max(0,c.i)/n*100}%"></i></div>`;
  if(c.phase==="intro"){
    app.innerHTML=top("Start")+`<section class="card"><div class="detail">${signHTML(BYN[1])}</div><p class="judge">Judge: “Are you ready?”</p><p>${esc(dog()[0].toUpperCase()+dog().slice(1))} is on your left, leash loose. Nod, and the judge says “Forward.” The clock starts.</p><button class="btn block" id="go">Forward</button></section>`;
    document.getElementById("go").onclick=()=>{c.i=0;c.phase="sign";c.tries=0;c.opts=null;renderCourse();};
    return;
  }
  if(c.phase==="sign"){
    const s=BYN[c.seq[c.i]];
    if(!c.opts){const q=makeQ(s);q.type="a";c.opts=q.opts;}
    app.innerHTML=top(c.tries?"Retry":"Next sign")+`<section class="card"><div class="detail">${signHTML(s)}</div><h3>${c.tries?"Retry costs 3 points. Try again:":"What do you do?"}</h3><div class="opts">${c.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.d)}</button>`).join("")}</div><div id="fb"></div></section>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const o=c.opts[+b.dataset.k];const ok=o.n===s.n;
      app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      let msg,cls;
      if(ok){b.classList.add("right");msg=`<b>Nice. #${s.n} done.</b><span class="tip"><b>Small-dog tip:</b> ${esc(s.tip)}</span>`;cls="";S.mast[s.n]=(S.mast[s.n]||0)+1;}
      else if(c.tries===0){b.classList.add("wrong");c.ded[c.i].push({p:3,why:"Retry"});c.tries=1;msg=`<b>Judge: “Retry.” −3</b><span>That's not this sign. You get one retry.</span>`;cls=" warn";S.mast[s.n]=0;}
      else{b.classList.add("wrong");app.querySelectorAll(".opt").forEach((x,k)=>{if(c.opts[k].n===s.n)x.classList.add("right");});c.ded[c.i].push({p:7,why:"Incorrectly performed"});msg=`<b>Incorrectly performed. 10 points total on this sign.</b><span>${esc(s.d)}</span>`;cls=" bad";}
      save();
      const fb=document.getElementById("fb");
      if(!ok&&c.tries===1&&c.ded[c.i].length===1){
        fb.innerHTML=`<div class="fb${cls}">${msg}</div><button class="btn block" id="next" style="margin-top:12px">Retry the sign</button>`;
        document.getElementById("next").onclick=()=>{c.opts=shuffle(c.opts);renderCourse();};
      }else{
        fb.innerHTML=`<div class="fb${cls}">${msg}</div><button class="btn block" id="next" style="margin-top:12px">Heel on</button>`;
        document.getElementById("next").onclick=advance;
      }
      document.getElementById("next").focus({preventScroll:true});
    });
    return;
  }
  if(c.phase==="moment"){
    const m=MOMENTS[c.momentAt[c.i]];const opts=c.mopts||(c.mopts=shuffle(m.o));
    app.innerHTML=top("In the ring")+`<section class="card"><p class="judge">Between signs</p><h3 style="text-transform:none;font-size:1.35rem">${esc(m.q.replace("{dog}",dog()))}</h3><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o[0])}</button>`).join("")}</div><div id="fb"></div></section>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.k];app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      const best=Math.min(...opts.map(x=>x[1]<0?99:x[1]));
      b.classList.add(o[1]===best?"right":"wrong");
      const fb=document.getElementById("fb");
      if(o[1]<0){c.nq=o[2];fb.innerHTML=`<div class="fb bad"><b>Judge: “Thank you.” NQ</b><span>${esc(o[2])}</span></div><button class="btn block" id="next" style="margin-top:12px">See scoresheet</button>`;document.getElementById("next").onclick=()=>finish();}
      else{if(o[1]>0)c.ded[c.i].push({p:o[1],why:o[0]});fb.innerHTML=`<div class="fb${o[1]===0?"":o[1]>=3?" bad":" warn"}"><b>${o[1]===0?"No deduction.":"−"+o[1]+(o[1]===1?" point":" points")}</b><span>${esc(o[2])}</span></div><button class="btn block" id="next" style="margin-top:12px">Heel on</button>`;document.getElementById("next").onclick=()=>{c.mopts=null;c.momentDone=c.i;advance();};}
      document.getElementById("next").focus({preventScroll:true});
    });
    return;
  }
  if(c.phase==="result")return renderResult();
}
function advance(){
  const c=course;
  if(c.momentAt[c.i]!==undefined&&c.momentDone!==c.i&&c.phase==="sign"){c.phase="moment";renderCourse();window.scrollTo(0,0);return;}
  c.i++;c.tries=0;c.opts=null;c.phase="sign";
  if(c.i>=c.seq.length)return finish();
  renderCourse();window.scrollTo(0,0);
}
function finish(){
  const c=course;c.phase="result";c.final=c.nq?0:scoreNow();c.q=!c.nq&&c.final>=70;
  S.runs++;if(!c.nq)S.best=Math.max(S.best,c.final);if(c.q)S.legs=Math.min(3,S.legs+1);
  markDay();save();renderCourse();window.scrollTo(0,0);
}
function renderResult(){
  const c=course;
  const rows=c.seq.map((n,i)=>{const t=stationTotal(i);const s=BYN[n];const why=c.ded[i].map(d=>d.why).join("; ");const gone=c.nq&&i>c.i;return `<tr class="${t?"ded":""}"><td><b>${i+1}.</b> #${s.n} ${esc(s.name)}${why?`<br><span class="tip">${esc(why)}</span>`:""}</td><td>${gone?"–":t?"−"+t:"0"}</td></tr>`;}).join("");
  const ribbon=c.q?`<div class="ribbon pop" aria-label="Qualifying ribbon"><div class="t1"></div><div class="t2"></div><div class="ros"><div class="ctr">Quali-<br>fying<br>${c.final}</div></div></div>`:"";
  const msg=c.nq?esc(c.nq):c.q?(S.legs>=3?`That's 3 legs. In the game, ${esc(dog())} is an RN. Time to find a real trial.`:`Qualifying score. ${S.legs} of 3 legs toward RN.`):`${c.final} is under 70. No leg this time. Check the scoresheet for where points went.`;
  app.innerHTML=header("Mock trial","Scoresheet")+`<section class="card">${ribbon}<div class="scoreline"><h2>${c.nq?"Non-qualifying":c.q?"You qualified":"No Q"}</h2><span class="big" style="color:${c.q?"var(--good)":"var(--bad)"}">${c.nq?"NQ":c.final}</span></div><p>${msg}</p></section>
  <div class="sheet"><div class="hd"><span>Rally Novice</span><span>${c.seq.length} signs</span></div><table><tbody>${rows}<tr><td><b>Total</b> (out of 100)</td><td>${c.nq?"NQ":c.final}</td></tr></tbody></table></div>
  <div class="grid2"><button class="btn" id="again">New course</button><button class="btn ghost" id="judge">Judge quiz</button></div>`;
  document.getElementById("again").onclick=()=>{startCourse();renderCourse();window.scrollTo(0,0);};
  document.getElementById("judge").onclick=()=>{jq={qs:pick(JQ,10),i:0,right:0,answered:false};course={phase:"menu"};go("drill");};
}

/* ---------- Heel Lab ---------- */
function markDay(){const t=today();if(!S.days.includes(t)){S.days.push(t);if(S.days.length>400)S.days=S.days.slice(-400);}}
function renderHeel(){
  const cur=heelLevel();
  app.innerHTML=header("Heel Lab","Build the heel")+`<section class="card"><p>Eight short levels for a small dog still learning to heel. Do one level for 3–5 minutes, once or twice a day. Stop while ${esc(dog())} still wants more. Log each session, and mark a level passed when you hit the goal.</p><p class="tip"><b>Practice treats are great.</b> They just can't come into the ring, so Level 8 teaches ${esc(dog())} to work with the treats off your body.</p></section>
  <div class="list">${HEEL.map((h,i)=>{const st=S.heel[i]||{s:0,p:false};const locked=i>cur;const done=st.p;
    return `<section class="lvl${done?" done":""}${locked?" locked":""}" aria-label="Level ${i+1}"><div class="hdr"><h3>${i+1}. ${esc(h.t)}</h3><span class="badge${done?" good":""}">${done?"Passed":locked?"Locked":"Now"}</span></div>
    ${locked?`<p class="tip">Unlocks after level ${i}.</p>`:`<p>${esc(h.d)}</p><p class="tip"><b>Session:</b> ${esc(h.r)}</p><p class="tip"><b>Pass when:</b> ${esc(h.p)}</p>
    <div class="row"><button class="btn" data-log="${i}">Log a session</button><button class="btn ghost" data-pass="${i}">${done?"Undo pass":"Mark passed"}</button><span class="muted" style="font-variant-numeric:tabular-nums">${st.s} session${st.s===1?"":"s"}</span></div>`}</section>`;}).join("")}</div>
  <p class="muted">${streak()} day streak. Drills and mock courses count too.</p>`;
  app.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>{const i=+b.dataset.log;S.heel[i]=S.heel[i]||{s:0,p:false};S.heel[i].s++;markDay();save();renderHeel();});
  app.querySelectorAll("[data-pass]").forEach(b=>b.onclick=()=>{const i=+b.dataset.pass;S.heel[i]=S.heel[i]||{s:0,p:false};S.heel[i].p=!S.heel[i].p;if(!S.heel[i].p){for(let j=i+1;j<HEEL.length;j++)if(S.heel[j])S.heel[j].p=false;}markDay();save();renderHeel();});
}

/* ---------- Boot ---------- */
function start(data){
  load();
  if(data&&data.course)course=data.course;
  const h=location.hash.slice(1);view=VIEWS.includes(h)?h:"home";
  render();
}
start({});
})();
